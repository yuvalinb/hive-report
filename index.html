<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLE Link Report</title>
<!--
  Login shell for the ble-report Edge Function.

  A browser cannot attach an "Authorization: Bearer <jwt>" header to a top-level
  navigation, and the function is gated on exactly that header (verify_jwt).
  So the report is never opened directly. This page signs the user in, fetches
  the function with the session token, and shows the HTML it returns in an
  <iframe srcdoc>.

  srcdoc rather than innerHTML: scripts inside srcdoc execute, so the report's
  own expand/collapse and tooltip code keeps working. Injected with innerHTML
  the same markup would render but be inert.

  Deploy: upload to a Supabase Storage bucket and open its public URL. The file
  holds no secret — the anon key is designed to be public, and the report itself
  is reachable only with a valid user session.
-->
<style>
  :root { color-scheme: light dark; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
         background:#f9f9f7; color:#0b0b0b; }
  @media (prefers-color-scheme: dark) {
    body { background:#0d0d0d; color:#fff; }
    .box { background:#1a1a19 !important; border-color:#2c2c2a !important; }
    input { background:#0d0d0d !important; color:#fff !important; border-color:#2c2c2a !important; }
  }
  .wrap { max-width:380px; margin:12vh auto; padding:0 20px; }
  @media (max-width:640px) { .wrap { margin:6vh auto; } }
  .box { background:#fcfcfb; border:1px solid #e1e0d9; border-radius:12px; padding:22px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.sub { color:#7a7973; margin:0 0 18px; font-size:13px; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
          color:#52514e; font-weight:600; margin:12px 0 5px; }
  input { width:100%; box-sizing:border-box; font:14px inherit; padding:9px 10px;
          border:1px solid #e1e0d9; border-radius:8px; background:#fff; color:#0b0b0b; }
  button { width:100%; margin-top:16px; font:600 14px inherit; padding:10px;
           border-radius:8px; border:0; background:#0b0b0b; color:#fcfcfb; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .msg { margin-top:12px; font-size:13px; min-height:1.4em; }
  .msg.err { color:#d03b3b; }
  .bar { display:none; align-items:center; gap:10px; padding:6px 12px;
         border-bottom:1px solid #e1e0d9; background:#fcfcfb; font-size:12px; }
  .bar button { width:auto; margin:0; padding:4px 10px; font-size:12px;
                background:transparent; color:inherit; border:1px solid #e1e0d9; }
  /* dvh, not vh: on mobile the URL bar makes 100vh taller than the visible
     area, so the bottom of the report sits below the fold and cannot be
     scrolled to. vh first for browsers without dvh. */
  iframe { display:none; width:100%; border:0; }
  body.in .wrap { display:none; }
  body.in .bar { display:flex; flex:none; }
  /* Column layout rather than height:calc(100% - 34px): the bar is only 34px
     while it fits on one line, and at ~320px it wraps — then the old constant
     pushed the iframe's bottom past the viewport and you got an outer scrollbar
     around an inner one. Letting the iframe take the remaining space removes
     the magic number. */
  body.in { display:flex; flex-direction:column; height:100vh; height:100dvh; }
  body.in iframe { display:block; flex:1 1 auto; min-height:0; }
  #who { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>

<div class="bar">
  <strong>BLE link report</strong>
  <span id="who" style="color:#7a7973"></span>
  <span style="flex:1"></span>
  <button id="out">Sign out</button>
</div>
<iframe id="frame" title="BLE link report"></iframe>

<div class="wrap">
  <div class="box">
    <h1>BLE link report</h1>
    <p class="sub">Sign in to view gateway telemetry.</p>
    <form id="login">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pass">Password</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <button type="submit" id="go">Sign in</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>window.BLE_REPORT_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjcWx1anlzc2Zid2tkb2Zic3R2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMDM0MzksImV4cCI6MjA5Mjg3OTQzOX0.RDuGZeg8gD3Pwuw8OacVw0Leus8L_XwmK9J9L5CeXuI";window.BLE_REPORT_URL = "https://zcqlujyssfbwkdofbstv.supabase.co";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
  // Both are public by design: the project ref appears in every request URL,
  // and the anon key grants nothing on its own — the report is behind
  // verify_jwt, so a valid user session is still required. Even so the key is
  // not committed here: tools/deploy_report.sh injects both values into the
  // copy it uploads, so this file stays clean in git.
  const SUPABASE_URL = window.BLE_REPORT_URL || 'https://zcqlujyssfbwkdofbstv.supabase.co';
  const ANON_KEY = window.BLE_REPORT_ANON_KEY || '';
  const FN = SUPABASE_URL + '/functions/v1/ble-report';

  const msg = document.getElementById('msg');
  const frame = document.getElementById('frame');
  const go = document.getElementById('go');

  if (!ANON_KEY) {
    msg.textContent = 'Anon key not set — define window.BLE_REPORT_ANON_KEY before this script.';
    msg.className = 'msg err';
    return;
  }
  const sb = supabase.createClient(SUPABASE_URL, ANON_KEY);

  // Current view; the report's own controls hand back changes via postMessage.
  const params = {
    gateway: 4,
    hours: 24,
    interval: 0,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC',
  };

  async function load() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { document.body.classList.remove('in'); return; }
    document.body.classList.add('in');
    document.getElementById('who').textContent = session.user.email || '';
    frame.setAttribute('srcdoc',
      '<p style="font:14px system-ui;margin:24px">Loading report…</p>');
    const qs = new URLSearchParams(params).toString();
    try {
      const r = await fetch(FN + '?' + qs, {
        headers: { Authorization: 'Bearer ' + session.access_token, apikey: ANON_KEY },
      });
      const html = await r.text();
      if (!r.ok) {
        frame.setAttribute('srcdoc',
          '<pre style="font:12px ui-monospace;white-space:pre-wrap;margin:24px">' +
          ('HTTP ' + r.status + '\n\n' + html).replace(/</g, '&lt;') + '</pre>');
        return;
      }
      // srcdoc, not innerHTML — the report's inline scripts must run.
      frame.setAttribute('srcdoc', html);
    } catch (e) {
      frame.setAttribute('srcdoc',
        '<pre style="font:12px ui-monospace;margin:24px">' + String(e).replace(/</g, '&lt;') + '</pre>');
    }
  }

  window.addEventListener('message', ev => {
    if (!ev.data || ev.data.type !== 'ble-report-nav') return;
    Object.assign(params, ev.data.params);
    params.tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
    load();
  });

  document.getElementById('login').addEventListener('submit', async ev => {
    ev.preventDefault();
    go.disabled = true;
    msg.className = 'msg';
    msg.textContent = 'Signing in…';
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById('email').value,
      password: document.getElementById('pass').value,
    });
    go.disabled = false;
    if (error) { msg.className = 'msg err'; msg.textContent = error.message; return; }
    msg.textContent = '';
    load();
  });

  document.getElementById('out').addEventListener('click', async () => {
    await sb.auth.signOut();
    document.body.classList.remove('in');
    frame.removeAttribute('srcdoc');
  });

  load();
})();
</script>
</body>
</html>
